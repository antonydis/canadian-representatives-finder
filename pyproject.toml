[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infocivic-cloudflare"
version = "0.1.0"
description = "InfoCivic Canadian representatives finder"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0.0",
  "requests>=2.28.0",
  "anthropic>=0.40.0",
  "python-dotenv>=1.0.0"
]

[project.scripts]
canrep = "src.main:run"

[tool.setuptools.packages.find]
include = ["src*"]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk"
]
